<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rishabh Mishra — Resume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F7F4;
    --paper-raised:#FFFFFF;
    --ink:#11203A;
    --ink-soft:#4B586E;
    --ink-faint:#8790A1;
    --rule:#DADEE3;
    --rule-strong:#11203A;
    --accent:#0E6E5E;
    --accent-soft:#E4EFEB;
    --accent-line: rgba(14,110,94,0.35);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:#E9E9E5;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .page{
    width:100%;
    max-width:960px;
    min-height:100vh;
    margin:0 auto;
    background:var(--paper);
    box-shadow:0 0 40px rgba(0,0,0,0.08);
  }

  @media print{
    body{ background:var(--paper); }
    .page{ box-shadow:none; max-width:none; }
    @page{ margin:12mm; size:A4; }
  }

  /* ===== Header ===== */
  header{
    padding:34px 44px 22px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
    border-bottom:2px solid var(--rule-strong);
  }

  .id-block h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:38px;
    letter-spacing:-0.01em;
    margin:0 0 2px;
    line-height:1.05;
    color:var(--ink);
  }

  .id-block .credential{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--accent);
    letter-spacing:0.03em;
    margin-bottom:10px;
  }

  .id-block .role-line{
    font-size:15px;
    color:var(--ink-soft);
    font-weight:500;
  }

  .contact-block{
    text-align:right;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    line-height:1.9;
    white-space:nowrap;
  }
  .contact-block a{ color:var(--ink-soft); text-decoration:none; }
  .contact-block .loc{ color:var(--ink-faint); }

  /* ===== Layout ===== */
  .body-grid{
    display:grid;
    grid-template-columns:1fr 300px;
    gap:0;
  }

  main{
    padding:26px 30px 30px 44px;
    border-right:1px solid var(--rule);
  }

  aside{
    padding:26px 44px 30px 30px;
  }

  .section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--rule);
  }

  /* ===== Summary ===== */
  .summary{
    font-size:13.3px;
    line-height:1.62;
    color:var(--ink-soft);
    margin:0 0 26px;
  }
  .summary strong{ color:var(--ink); font-weight:600; }

  /* ===== Ledger (signature element) ===== */
  .ledger{
    margin:0 0 28px;
    border-top:1px solid var(--rule);
  }
  .ledger-row{
    display:grid;
    grid-template-columns:1fr auto;
    align-items:baseline;
    gap:14px;
    padding:9px 0;
    border-bottom:1px
